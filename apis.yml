- aid: tecovas:tecovas-storefront-graphql-api
  name: Tecovas Storefront GraphQL API
  description: 'The Shopify Storefront GraphQL API as deployed on the Tecovas checkout host. Anonymous
    introspection succeeds (424 types, 35 query fields, 41 mutations), covering products, collections,
    carts, blogs, menus, metaobjects, localization and search. Not listed in the company''s own
    api-catalog, but reachable without credentials.'
