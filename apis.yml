aid: tecovas
name: Tecovas
description: 'Tecovas is an Austin, Texas direct-to-consumer Western wear brand selling handcrafted
  cowboy boots, work boots, hats, leather goods and apparel for men, women and kids, made by artisans
  in Leon, Mexico and sold online and through its own US retail stores. Its storefront runs on Shopify
  Hydrogen (React Router 7) with Sanity content and Algolia search, and it publishes an unusually
  complete agent-facing surface for a retailer: an llms.txt, an agents.md, an RFC 9727 api-catalog
  linkset of read-only JSON endpoints, a Cloudflare-style agent-skills discovery index, an anonymously
  introspectable Shopify Storefront GraphQL API, and a Universal Commerce Protocol (UCP) MCP endpoint
  on its Shopify checkout host for agent-driven cart and checkout.'
