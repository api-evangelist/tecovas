- aid: tecovas:tecovas-ucp-agentic-commerce
  name: Tecovas Agentic Commerce (UCP/MCP)
  description: 'Tecovas implements the Universal Commerce Protocol 2026-04-08 on its Shopify checkout
    host, exposing an MCP endpoint whose tools/list returns 13 tools with full JSON Schema inputs for
    catalog search and lookup, cart lifecycle, checkout lifecycle and order retrieval. Payment handlers
    advertised are Google Pay, Shopify card and Shop Pay. Checkout completion requires explicit
    contemporaneous human approval per the published agent instructions.'
