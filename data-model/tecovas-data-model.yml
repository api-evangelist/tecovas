source: graphql/tecovas-storefront-introspection.json + live /api/productdetail response
note: Two distinct data models coexist. The Shopify Storefront GraphQL schema is the commerce core (products,
  variants, carts, orders). The Tecovas storefront JSON API exposes a separate Sanity-backed merchandising
  model whose central entity is the colorway, not the Shopify variant. Relationships in the graphql section
  were read directly from the introspection document; relationships in the storefront section were read
  from an actual /api/productdetail/the-earl response body. Nothing is inferred from a spec, because Tecovas
  publishes none.
